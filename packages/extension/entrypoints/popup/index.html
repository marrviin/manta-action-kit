<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manta Action Kit</title>
    <style>
      /* Fix the popup size before React/antd mount. The popup loads a heavy
         antd+React bundle, so Chrome would otherwise open a tiny empty box,
         parse the JS, then paint the menu and resize — a visible flicker.
         We give html/body the final width to keep the size stable. */
      html,
      body {
        margin: 0;
        width: 260px;
      }
      body {
        background: #fff;
      }
      #root {
        width: 260px;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #141414;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
