name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm Trusted Publishing (OIDC) 需要

jobs:
  publish-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org/
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @manta-action-kit/protocol build
      # 注意：npm OIDC 无法创建全新包（trusted publisher 配置挂在包的 Settings 页上），
      # protocol 首个版本需手动本地发布一次并在 npmjs.com 配置 trusted publisher，之后 CI 才能发。
      - run: pnpm --filter @manta-action-kit/protocol publish --no-git-checks --provenance --access public

  publish-mcp:
    needs: publish-protocol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org/
      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./packages/mcp/package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match packages/mcp version $PKG"
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm compile && pnpm test
      - run: pnpm build:mcp
      # pnpm pack 负责把 workspace:* 解析成实际版本号，npm publish 走已验证可用的 npm OIDC 通道
      - run: pnpm --filter @manta-action-kit/mcp pack
      - run: npm publish manta-action-kit-mcp-*.tgz --provenance --access public
