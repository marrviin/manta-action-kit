name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm Trusted Publishing (OIDC) 需要

jobs:
  publish-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org/
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @manta-action-kit/protocol build
      # 注意：npm OIDC 无法创建全新包（trusted publisher 配置挂在包的 Settings 页上），
      # protocol 首个版本需手动本地发布一次并在 npmjs.com 配置 trusted publisher，之后 CI 才能发。
      # 已发布同版本则跳过：publish 链任一 job 失败后，重跑（re-run / 重推同 tag）不会
      # 因 npm 拒绝重复版本而卡死整条链。
      - name: Publish (skip if version already on npm)
        run: |
          PKG=$(node -p "require('./packages/protocol/package.json').version")
          if npm view "@manta-action-kit/protocol@$PKG" version >/dev/null 2>&1; then
            echo "@manta-action-kit/protocol@$PKG already on npm — skipping"
          else
            pnpm --filter @manta-action-kit/protocol publish --no-git-checks --provenance --access public
          fi

  publish-mcp:
    needs: publish-protocol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org/
      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./packages/mcp/package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match packages/mcp version $PKG"
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm compile && pnpm test
      - run: pnpm build:mcp
      # pnpm pack 负责把 workspace:* 解析成实际版本号，npm publish 走已验证可用的 npm OIDC 通道；
      # 已发布同版本则跳过（见 publish-protocol 里的说明）
      - name: Publish (skip if version already on npm)
        run: |
          PKG=$(node -p "require('./packages/mcp/package.json').version")
          if npm view "@manta-action-kit/mcp@$PKG" version >/dev/null 2>&1; then
            echo "@manta-action-kit/mcp@$PKG already on npm — skipping"
          else
            pnpm --filter @manta-action-kit/mcp pack
            npm publish manta-action-kit-mcp-*.tgz --provenance --access public
          fi

  # 扩展 zip 挂到 GitHub Release（不上架 Web Store，仅作为产物分发）。
  # 注意：extension 与 mcp 版本号不强制同步，故不做 tag 一致性校验。
  publish-extension:
    needs: publish-mcp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # wxt zip 会先完整构建再打包（产出 .output/<name>-<version>-chrome.zip）；
      # extension 依赖 protocol 的构建产物，须先构建
      - run: pnpm --filter @manta-action-kit/protocol build && pnpm --filter @manta-action-kit/extension zip
      - name: Check zip output exists
        run: |
          ZIPS=(packages/extension/.output/*.zip)
          if [ ! -e "${ZIPS[0]}" ]; then
            echo "No zip produced in packages/extension/.output/" >&2
            exit 1
          fi
          ls -lh "${ZIPS[@]}"
      # .output/ 在 .gitignore 里，upload-artifact@v4 会遵循 gitignore 排除文件——
      # 先拷到非忽略目录再上传
      - name: Stage zip for upload
        run: mkdir -p dist-extension && cp packages/extension/.output/*.zip dist-extension/
      - uses: actions/upload-artifact@v4
        with:
          name: chrome-extension-zip
          path: dist-extension/*.zip
          if-no-files-found: error

  github-release:
    needs: [publish-protocol, publish-mcp, publish-extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write # 创建 Release 需要
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release with changelog notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # 从 CHANGELOG.md 抽取当前版本的条目（到下一个 ## [ 小节为止）
          NOTES=$(awk "/^## \\[$VERSION\\]/{flag=1;next} /^## \\[/{flag=0} flag" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            echo "CHANGELOG.md has no $GITHUB_REF_NAME section" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "$NOTES"
      - uses: actions/download-artifact@v4
        with:
          name: chrome-extension-zip
          path: dist
      - name: Upload extension zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
